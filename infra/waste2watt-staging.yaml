AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Waste2Watt Environmental Intelligence Platform - Staging Infrastructure
  Deploys API Gateway (HTTP API v2), AWS Lambda, DynamoDB Single-Table,
  Amazon Cognito User Pool, and CloudWatch Monitoring with Least-Privilege IAM.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
    Description: Deployment tier identifier.

  AllowedOrigins:
    Type: String
    Default: 'https://staging.waste2watt.internal,http://localhost:5173'
    Description: Comma-separated list of permitted CORS origins.

  EnableBedrock:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable optional Amazon Bedrock IAM invocation permissions.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: production
        STORAGE_TYPE: dynamo
        DYNAMO_TABLE_NAME: !Ref RecordsTable
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        AI_PROVIDER: !If [BedrockEnabled, 'bedrock', 'deterministic']
        AI_MODEL: !If [BedrockEnabled, 'anthropic.claude-3-haiku-20240307-v1:0', 'deterministic-rules-v1']

Conditions:
  BedrockEnabled: !Equals [!Ref EnableBedrock, 'true']

Resources:
  # =========================================================================
  # 1. Amazon Cognito Identity & Authentication
  # =========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub waste2watt-users-${Environment}
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: institution
          AttributeDataType: String
          Mutable: true
        - Name: authorized_sites
          AttributeDataType: String
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub waste2watt-web-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # =========================================================================
  # 2. Amazon DynamoDB Single-Table Storage
  # =========================================================================
  RecordsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub waste2watt-records-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Waste2Watt
        - Key: Environment
          Value: !Ref Environment

  # =========================================================================
  # 3. Amazon API Gateway (HTTP API v2)
  # =========================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      CorsConfiguration:
        AllowOrigins:
          - 'http://localhost:5173'
          - 'http://127.0.0.1:5173'
          - 'https://staging.waste2watt.internal'
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['Content-Type', 'Authorization', 'X-Request-Id']
        AllowCredentials: true
        MaxAge: 300
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              Audience:
                - !Ref CognitoUserPoolClient
              Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'

  # =========================================================================
  # 4. AWS Lambda Execution & Backend Handler
  # =========================================================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend/src/lambda.handler
      CodeUri: ../backend/dist/
      Policies:
        # DynamoDB Least-Privilege Policy
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
      Events:
        HealthEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer

  # Optional Bedrock Invoke Policy Attachment
  BedrockInvocationPolicy:
    Type: AWS::IAM::Policy
    Condition: BedrockEnabled
    Properties:
      PolicyName: !Sub waste2watt-bedrock-invoke-${Environment}
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14

Outputs:
  HttpApiUrl:
    Description: Staging API Gateway Base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: Cognito Web Client ID
    Value: !Ref CognitoUserPoolClient
  DynamoTableName:
    Description: DynamoDB Active Table Name
    Value: !Ref RecordsTable
